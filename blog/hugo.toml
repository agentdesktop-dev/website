baseURL = "https://agentdesktop.dev/blog/"
locale = "en-US"
title = "agentdesktop blog"
enableRobotsTXT = false
summaryLength = 32

[pagination]
pagerSize = 8

[params]
description = "Engineering notes, release updates, and field reports from the agentdesktop project."
author = "agentdesktop team"
github = "https://github.com/agentdesktop-dev/agentdesktop"
docsURL = "/docs/"
marketingURL = "/"
siteURL = "https://agentdesktop.dev/"
defaultImage = "https://agentdesktop.dev/opengraph-image"

[permalinks]
posts = "/:year/:month/:slug/"

[taxonomies]
category = "categories"
tag = "tags"

[outputs]
home = ["HTML", "RSS", "JSON"]
section = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term = ["HTML", "RSS"]

[related]
includeNewer = true
threshold = 60
toLower = true

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "categories"
weight = 80

[[related.indices]]
name = "date"
weight = 10

[markup.goldmark.renderer]
unsafe = false

[markup.highlight]
noClasses = false
lineNos = false

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "static"
target = "static"

[[module.mounts]]
source = "../docs/assets/imgs"
target = "assets/imgs"

[[module.mounts]]
source = "../public/images"
target = "static/images"