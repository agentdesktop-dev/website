<text x="380" y="111" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#151927">Pi</text>
<text x="380" y="129" text-anchor="middle" font-family="'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#555b70">coding agent</text><g filter="url(#lift)"><rect x="40" y="300" width="420" height="72" rx="9" fill="#f1eafb" stroke="#c9b3f2" stroke-width="1.3"/></g>
