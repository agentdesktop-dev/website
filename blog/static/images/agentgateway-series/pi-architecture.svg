<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" width="1040" height="470" role="img" aria-label="Pi architecture: root agentdesktop daemon writes the user's Pi config, Pi reaches the DGX Spark only through agentgateway">
<title>Pi architecture: root agentdesktop daemon writes the user's Pi config, Pi reaches the DGX Spark only through agentgateway</title>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555b70"/></marker>
  <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6e29e0"/></marker>
  <filter id="lift" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#151927" flood-opacity="0.08"/></filter>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#e3e5ee"/></pattern>
</defs>
<rect width="1040" height="470" rx="14" fill="#ffffff"/>
<rect width="1040" height="470" rx="14" fill="url(#dots)"/>
