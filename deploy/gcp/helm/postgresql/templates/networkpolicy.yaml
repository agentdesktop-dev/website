{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "agentdesktop-postgresql.fullname" . }}
  labels:
    {{- include "agentdesktop-postgresql.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "agentdesktop-postgresql.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.controllerPodSelector | nindent 14 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: database-backup
      ports:
        - port: postgresql
          protocol: TCP
{{- end }}