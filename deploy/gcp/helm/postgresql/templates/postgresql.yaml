apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentdesktop-postgresql.fullname" . }}
  labels:
    {{- include "agentdesktop-postgresql.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agentdesktop-postgresql.fullname" . }}
  labels:
    {{- include "agentdesktop-postgresql.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.size | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentdesktop-postgresql.fullname" . }}
  labels:
    {{- include "agentdesktop-postgresql.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agentdesktop-postgresql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentdesktop-postgresql.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "agentdesktop-postgresql.fullname" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-tls
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              umask 077
              cp /tls-source/{{ .Values.tls.certificateKey }} /tls/server.crt
              cp /tls-source/{{ .Values.tls.privateKeyKey }} /tls/server.key
              chmod 0600 /tls/server.crt /tls/server.key
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tls-source
              mountPath: /tls-source
              readOnly: true
            - name: tls
              mountPath: /tls
      containers:
        - name: postgresql
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - postgres
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgresql/tls/server.crt
            - -c
            - ssl_key_file=/etc/postgresql/tls/server.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - password_encryption=scram-sha-256
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.database.user | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret is required" .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums --auth-host=scram-sha-256"
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.database.user | quote }}, "-d", {{ .Values.database.name | quote }}]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: tls
              mountPath: /etc/postgresql/tls
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "agentdesktop-postgresql.fullname" . }}
        - name: tls-source
          secret:
            secretName: {{ required "tls.existingSecret is required" .Values.tls.existingSecret }}
            defaultMode: 0440
        - name: tls
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentdesktop-postgresql.fullname" . }}
  labels:
    {{- include "agentdesktop-postgresql.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "agentdesktop-postgresql.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      protocol: TCP