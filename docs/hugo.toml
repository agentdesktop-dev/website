baseURL = "https://agentdesktop.io/docs/"
locale = "en-US"
title = "agentdesktop docs | Manage AI developer tools"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

[params]
description = "Deploy and manage agentdesktop across Linux, macOS, and Windows. Configure AI developer tools, MCP servers, skills, MDM enrollment, and inference gateways."
github = "https://github.com/agentdesktop-dev/agentdesktop"
marketingURL = "/"

[sitemap]
changeFreq = "monthly"
priority = 0.7
filename = "sitemap.xml"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
noClasses = false
lineNos = false

[markup.tableOfContents]
startLevel = 2
endLevel = 3
ordered = false

[[module.mounts]]
source = "assets"
target = "assets"

[[module.mounts]]
source = "../public/downloads"
target = "static/downloads"